packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  argon2: true
  # Install-time usage telemetry pulled in by swagger-ui-dist; not needed.
  '@scarf/scarf': false
  esbuild: false
  prisma: true
  workerd: false
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21'
  - '@expo/metro-config@58.0.23'
  - '@expo/router-server@58.0.23'
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo-router@58.0.32
  - expo@58.0.26
